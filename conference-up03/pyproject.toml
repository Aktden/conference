[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "release", "submission"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
[tool.coverage.run]
source = ["routers", "main", "config", "database", "security", "models"]
