<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секции - Конференция </title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
    <div class="logo-icon">🎓</div>
    <div class="logo-text">Конференция</div>
</div>
            <nav>
                <div class="nav-label">Основное</div>
                <a href="index.html"><i class="fas fa-chart-line"></i><span>Дашборд</span></a>
                <a href="participants.html"><i class="fas fa-users"></i><span>Участники</span></a>
                <a href="sections.html" class="active"><i class="fas fa-layer-group"></i><span>Секции</span></a>
                <div class="nav-label">Управление</div>
                <a href="badges.html"><i class="fas fa-id-card"></i><span>Бейджи</span></a>
                <a href="attendance.html"><i class="fas fa-calendar-check"></i><span>Посещение</span></a>
                <a href="reports.html"><i class="fas fa-file-alt"></i><span>Отчёты</span></a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="exportData()" class="btn" style="width:100%"><i class="fas fa-download"></i> Экспорт</button>
                <button onclick="clearAll()" class="btn danger" style="width:100%"><i class="fas fa-trash"></i> Сброс</button>
            </div>
        </aside>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1>Секции</h1>
                    <p>Управление тематическими секциями конференции</p>
                </div>
            </div>

            <div class="page-body">
                <div class="card">
                    <div class="card-title"><i class="fas fa-plus"></i> Новая секция</div>
                    <form id="secForm" class="form-grid" onsubmit="addSection(event)">
                        <div class="form-field"><label class="form-label">Название *</label><input name="title" placeholder="Название секции" required></div>
                        <div class="form-field"><label class="form-label">Зал</label><input name="room" placeholder="А-101"></div>
                        <div class="form-field"><label class="form-label">Время</label><input name="startTime" placeholder="10:00"></div>
                        <div class="form-field"><label class="form-label">Вместимость *</label><input name="capacity" type="number" placeholder="50" required min="1"></div>
                        <div class="form-field" style="justify-content:flex-end"><button type="submit" class="btn primary"><i class="fas fa-save"></i> Создать</button></div>
                    </form>
                </div>

                <div class="card">
                    <div class="section-header">
                        <span class="section-title"><i class="fas fa-list"></i> Список секций</span>
                        <button onclick="loadSections()" class="btn icon-only"><i class="fas fa-sync-alt"></i></button>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>ID</th><th>Название</th><th>Зал</th><th>Время</th><th>Мест</th><th>Занято</th><th></th></tr></thead>
                            <tbody id="secTableBody"><tr><td colspan="7" class="td-empty">Загрузка...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function loadSections() {
            const [secs, att] = await Promise.all([API.getSections(), API.getAttendance()]);
            const tbody = document.getElementById('secTableBody');
            if (secs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="td-empty">Нет секций</td></tr>';
                return;
            }
            tbody.innerHTML = secs.map(s => {
                const count = att.filter(a => a.sectionId === s.id).length;
                const pct = Math.round(count / s.capacity * 100);
                return `<tr>
                    <td class="td-id">#${s.id}</td>
                    <td><strong>${s.title}</strong></td>
                    <td style="color:#6b7280">${s.room || '—'}</td>
                    <td style="color:#6b7280">${s.startTime || '—'}</td>
                    <td>${s.capacity}</td>
                    <td><div style="display:flex;align-items:center;gap:8px"><div class="chart-bar-track" style="width:80px"><div class="chart-bar-fill" style="width:${pct}%;background:${pct >= 90 ? '#dc2626' : pct >= 70 ? '#f59e0b' : '#10b981'}"></div></div><span style="font-size:12px">${count}/${s.capacity}</span></div></td>
                    <td><button class="btn danger sm" onclick="delSection(${s.id})"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            }).join('');
        }

        async function addSection(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            data.capacity = +data.capacity;
            try {
                await API.createSection(data);
                showToast('Секция создана');
                form.reset();
                loadSections();
            } catch (err) { }
        }

        async function delSection(id) {
            if (!confirm('Удалить секцию?')) return;
            try {
                await API.deleteSection(id);
                showToast('Секция удалена', 'warning');
                loadSections();
            } catch (err) { }
        }

        document.addEventListener('DOMContentLoaded', loadSections);
    </script>
</body>
</html>
