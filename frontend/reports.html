<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёты — Конференция</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
    <div class="logo-icon">🎓</div>
    <div class="logo-text">Конференция</div>
</div>
            <nav>
                <div class="nav-label">Основное</div>
                <a href="index.html"><i class="fas fa-chart-line"></i><span>Дашборд</span></a>
                <a href="participants.html"><i class="fas fa-users"></i><span>Участники</span></a>
                <a href="sections.html"><i class="fas fa-layer-group"></i><span>Секции</span></a>
                <div class="nav-label">Управление</div>
                <a href="badges.html"><i class="fas fa-id-card"></i><span>Бейджи</span></a>
                <a href="attendance.html"><i class="fas fa-calendar-check"></i><span>Посещение</span></a>
                <a href="reports.html" class="active"><i class="fas fa-file-alt"></i><span>Отчёты</span></a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="exportData()" class="btn" style="width:100%"><i class="fas fa-download"></i> Экспорт</button>
                <button onclick="clearAll()" class="btn danger" style="width:100%"><i class="fas fa-trash"></i> Сброс</button>
            </div>
        </aside>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1>Аналитика и отчёты</h1>
                    <p>Сводная статистика по конференции</p>
                </div>
                <div class="actions-row">
                    <button onclick="loadReports()" class="btn"><i class="fas fa-sync-alt"></i> Обновить</button>
                    <button onclick="exportReport()" class="btn primary"><i class="fas fa-download"></i> Скачать отчёт</button>
                </div>
            </div>

            <div class="page-body">
                <!-- Статистика -->
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">Участники</div><div class="stat-value" id="s-participants">—</div></div>
                    <div class="stat-card"><div class="stat-label">Секции</div><div class="stat-value" id="s-sections">—</div></div>
                    <div class="stat-card"><div class="stat-label">Присутствовали</div><div class="stat-value" id="s-attended">—</div></div>
                    <div class="stat-card"><div class="stat-label">Посещаемость</div><div class="stat-value" id="s-rate">—</div></div>
                </div>

                <!-- Графики -->
                <div class="grid-2">
                    <div class="card">
                        <div class="card-title"><i class="fas fa-chart-pie"></i> Участники по ролям</div>
                        <div id="chartRoles"></div>
                    </div>
                    <div class="card">
                        <div class="card-title"><i class="fas fa-chart-simple"></i> Заполненность секций</div>
                        <div id="chartSections"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><i class="fas fa-chart-bar"></i> Детальный отчёт</div>
                    <div class="section-header">
                        <span>Все записи</span>
                        <button onclick="generateReport()" class="btn primary"><i class="fas fa-chart-line"></i> Сформировать</button>
                    </div>
                    <pre id="reportOutput"></pre>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function loadReports() {
            try {
                const [stats, participants, sections, attendance] = await Promise.all([
                    API.getStats(),
                    API.getParticipants(),
                    API.getSections(),
                    API.getAttendance()
                ]);

                // Обновляем статистику
                document.getElementById('s-participants').textContent = stats.participants || 0;
                document.getElementById('s-sections').textContent = stats.sections || 0;
                document.getElementById('s-attended').textContent = `${stats.attended || 0}/${stats.attendance_records || 0}`;
                document.getElementById('s-rate').textContent = (stats.attendance_rate || 0) + '%';

                // График ролей
                const roles = {
                    'докладчик': participants.filter(p => p.role === 'докладчик').length,
                    'слушатель': participants.filter(p => p.role === 'слушатель').length,
                    'организатор': participants.filter(p => p.role === 'организатор').length
                };
                const maxRole = Math.max(...Object.values(roles), 1);

                const roleColors = {
                    'докладчик': '#6d28d9',
                    'слушатель': '#8b5cf6',
                    'организатор': '#ec4899'
                };

                document.getElementById('chartRoles').innerHTML = Object.entries(roles).map(([name, count]) => `
                    <div class="chart-bar-row">
                        <div class="chart-bar-label">${name === 'докладчик' ? '🎤 Докладчики' : name === 'слушатель' ? '👥 Слушатели' : '⚙️ Организаторы'}</div>
                        <div class="chart-bar-track">
                            <div class="chart-bar-fill" style="width: ${(count / maxRole) * 100}%; background: ${roleColors[name]}"></div>
                        </div>
                        <div class="chart-bar-value">${count}</div>
                    </div>
                `).join('');

                // График секций
                if (sections.length > 0) {
                    const sectionData = sections.map(s => {
                        const registered = attendance.filter(a => a.sectionId === s.id).length;
                        const percentage = (registered / s.capacity) * 100;
                        return { ...s, registered, percentage };
                    });

                    document.getElementById('chartSections').innerHTML = sectionData.map(s => `
                        <div class="chart-bar-row">
                            <div class="chart-bar-label" title="${s.title}">${s.title.length > 20 ? s.title.slice(0, 20) + '…' : s.title}</div>
                            <div class="chart-bar-track">
                                <div class="chart-bar-fill" style="width: ${s.percentage}%; background: ${s.percentage > 90 ? '#dc2626' : s.percentage > 70 ? '#f59e0b' : '#10b981'}"></div>
                            </div>
                            <div class="chart-bar-value">${s.registered}/${s.capacity}</div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('chartSections').innerHTML = '<div class="td-empty">Нет данных о секциях</div>';
                }

            } catch (error) {
                console.error('Ошибка загрузки отчётов:', error);
            }
        }

        async function generateReport() {
            try {
                const [participants, sections, attendance] = await Promise.all([
                    API.getParticipants(),
                    API.getSections(),
                    API.getAttendance()
                ]);

                const partMap = Object.fromEntries(participants.map(p => [p.id, p]));
                const secMap = Object.fromEntries(sections.map(s => [s.id, s]));

                let report = '╔════════════════════════════════════════════╗\n';
                report += '║         ОТЧЁТ ПО КОНФЕРЕНЦИИ 2025          ║\n';
                report += '╚════════════════════════════════════════════╝\n\n';
                report += `Дата: ${new Date().toLocaleString('ru-RU')}\n`;
                report += `Всего участников: ${participants.length}\n`;
                report += `Всего секций: ${sections.length}\n`;
                report += `Записей о посещении: ${attendance.length}\n\n`;

                report += '─ УЧАСТНИКИ ─────────────────────────────────────\n';
                participants.forEach(p => {
                    report += `  ${String(p.id).padStart(3)}. ${p.lastName} ${p.firstName}\n`;
                    report += `      ${p.organization || '—'} | ${p.role} | Бейдж: ${p.badgePrinted ? '✓' : '✗'}\n`;
                });

                report += '\n─ ПОСЕЩЕНИЕ ────────────────────────────────────\n';
                attendance.forEach(a => {
                    const p = partMap[a.participantId] || {};
                    const s = secMap[a.sectionId] || {};
                    report += `  ${(p.lastName || '?')} ${(p.firstName || '')} → ${s.title || '?'}: ${a.status}\n`;
                });

                const output = document.getElementById('reportOutput');
                output.textContent = report;
                output.style.display = 'block';
                showToast('Отчёт сформирован');
            } catch (error) {
                showToast('Ошибка формирования отчёта', 'error');
            }
        }

        function exportReport() {
            const text = document.getElementById('reportOutput')?.textContent;
            if (!text) {
                showToast('Сначала сформируйте отчёт', 'warning');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `conference-report-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Отчёт скачан');
        }

        document.addEventListener('DOMContentLoaded', loadReports);
    </script>
</body>
</html>
